name: tests

on:
  push:
  pull_request:
  schedule:
    # A locked package can pick up an advisory with no push to the repository.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        # The suite takes over an hour in one process, so each job runs a quarter of it, several modules at once.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: Install the locked versions
        if: matrix.python-version == '3.13'
        run: "pip install --require-hashes --only-binary :all: -r requirements.lock"
      - name: Install the version ranges
        if: matrix.python-version != '3.13'
        run: pip install -r requirements.txt
      - run: python scripts/run_tests.py --shard ${{ matrix.shard }}/4

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock
